<script>
    const startDate = new Date("2023-7-1 00:00:00")
    let yearsEl = document.querySelector(".years")
    let monthsEl = document.querySelector(".month")
    let daysEl = document.querySelector(".day")
    let hoursEl = document.querySelector(".hours")
    let minutesEl = document.querySelector(".minutes")
    let secondsEl = document.querySelector(".seconds")
    const tongzhiwb = document.querySelector(".tongzhik").textContent

    function calculateTime() {
        const now = new Date()
        const timeDiff = now - startDate
        const totalSeconds = Math.floor(timeDiff / 1000)
        const totalMinutes = Math.floor(totalSeconds / 60)
        const totalHours = Math.floor(totalMinutes / 60)
        const totalDays = Math.floor(totalHours / 24)
        const totalMonths = Math.floor(totalDays / 30.44)
        const totalYears = Math.floor(totalMonths / 12)
        const remainingMonths = totalMonths % 12
        const remainingDays = totalDays % 30.44
        const remainingHours = totalHours % 24
        const remainingMinutes = totalMinutes % 60
        const remainingSeconds = totalSeconds % 60
        yearsEl.textContent = totalYears
        monthsEl.textContent = Math.floor(remainingMonths)
        daysEl.textContent = Math.floor(remainingDays)
        hoursEl.textContent = String(remainingHours).padStart(2, '0')
        minutesEl.textContent = String(remainingMinutes).padStart(2, '0')
        secondsEl.textContent = String(remainingSeconds).padStart(2, '0')
    }
    calculateTime()
    const timer = setInterval(calculateTime, 1000)

    let sr = document.querySelector(".sr")
    let diffsr
    const totalyear = new Date()
    let startsryear = totalyear.getFullYear()
    let startsrtime = new Date(startsryear,7,29)
    const now = new Date()
    if (now>startsrtime){
        startsrtime=new Date(startsryear+1,7,29)
    }
    function srtime() {
        const now = new Date()
        if(now<=startsrtime){
            diffsr=startsrtime-now
        }
        else{
            diffsr=startsrtime-now
        }
        
        const srSeconds = Math.floor(diffsr / 1000)
        const srMinutes = Math.floor(srSeconds / 60)
        const srHours = Math.floor(srMinutes / 60)
        const srDays = Math.floor(srHours / 24)
        sr.textContent = srDays
    }
    srtime()
    const timesr = setInterval(srtime, 86400000)

    const holidays = [
        {date: new Date(startsryear,0,1), name: "元旦"},
        {date: new Date(startsryear,9,1), name: "国庆节"},
        {date: new Date(startsryear,9,2), name: "国庆节"},
        {date: new Date(startsryear,9,3), name: "国庆节"},
        {date: new Date(startsryear,9,4), name: "国庆节"},
        {date: new Date(startsryear,9,5), name: "国庆节"},
        {date: new Date(startsryear,9,6), name: "国庆节"},
        {date: new Date(startsryear,9,7), name: "国庆节"},
        {date: new Date(startsryear,4,1), name: "劳动节"},
        {date: new Date(startsryear,4,2), name: "劳动节"},
        {date: new Date(startsryear,4,3), name: "劳动节"},
        {date: new Date(startsryear,4,4), name: "劳动节"},
        {date: new Date(startsryear,4,5), name: "劳动节"}
    ]
    
    // 检查日期是否为节假日并返回名称
    function isHoliday(date) {
        return holidays.find(holiday =>
            date.getFullYear() === holiday.date.getFullYear() &&
            date.getMonth() === holiday.date.getMonth() &&
            date.getDate() === holiday.date.getDate()
        );
    }
    
    // 检查日期是否为生日
    function isBirthday(date) {
        return date.getMonth() === startsrtime.getMonth() &&
               date.getDate() === startsrtime.getDate();
    }

    $(document).ready(function() {
        const $datepicker = $("#datepicker").datepicker({
            defaultDate: new Date(),
            dateFormat: "yy-mm-dd",
            beforeShowDay: function(date){
                const holiday = isHoliday(date);
                const isbirthday = isBirthday(date);

                if(holiday){
                    return[true,"holidays",holiday.name];
                }else if(isbirthday){
                    return[true,"birthday","生日"];
                }

                return[true,"",""];
            },
            onSelect:function(dateText,inst){
                const selectedDate = $(this).datepicker('getDate')
                const holiday = isHoliday(selectedDate)
                const birthday = isBirthday(selectedDate)
                const tongzhik = $('.tongzhik')
                tongzhik.removeClass("holiday birthday")
                if(holiday){

                    tongzhik.text(`这天是${holiday.name}！！！\n😊😊😊`).addClass("holiday")

                    setTimeout(() => {
                        tongzhik.removeClass('holiday').text(`${tongzhiwb}`);
                    }, 7000);

                }else if(birthday){

                    tongzhik.text(`这天是你的生日哦！！！\n🎂🎂🎂`).addClass("birthday")

                    setTimeout(() => {
                        tongzhik.removeClass('birthday').text(`${tongzhiwb}`);
                    }, 7000);
                }else{
                    tongzhik.text(`${tongzhiwb}`)
                }
            }
        });
        function checktoday(){
            let today1= new Date();
            let holiday1 = isHoliday(today1)
            let birthday1 = isBirthday(today1)
            const tongzhik1 = $('.tongzhik')
            if(holiday1){
                tongzhik1.text(`今天是${holiday1.name}！！！\n😊😊😊`).addClass("holiday")
            }else if(birthday1){
                tongzhik1.text(`今天是你的生日哦！！！\n🎂🎂🎂`).addClass("birthday")
            }else{
                tongzhik1.text(`${tongzhiwb}`)
            }
        }
        checktoday()
        const today = new Date();
        const formattedToday = $.datepicker.formatDate("yy-mm-dd", today);
        $datepicker.val(formattedToday);

        const LinkContents ={
            "杜地照片":'<div style="float:right"><img src="./img/我来啦.jpg" class="img1"><img src="./img/我真的会蟹.jpg" class="img2"></div>  <div class="lst"><img src="./img/()就多().jpg" class="img3"> <img src="./img/中指" class="img4"><img src="./img/小初升.jpg" class="img5"><img src="./img/cosplay.jpg" class="img4"></div><p class="dwz">阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴阿巴</p>',
            "顾地照片":"2",
            "3":"3",
            "4":"4"
        }

        $(".bg table a").on("click",function(e){
            e.preventDefault()
            $(".bg table a").removeClass('bgys')
            $(this).addClass('bgys')
            const linkText = $(this).text()
            const content = LinkContents[linkText]
            $('.zck').html(`<div style="padding:10px">${content}</div>`)
        })
    });

    function showPage(pageid){
        document.querySelectorAll(".page").forEach(page => {
            page.style.display = 'none';
        })
        document.getElementById(pageid).style.display = 'block';
    }

    window.onscroll=function(){
        let huiding=document.querySelector(".huiding")
        if(window.scrollY>150){
            huiding.style.display="block"
        }
        else{
            huiding.style.display="none"
        }
    }

    document.addEventListener("click",function(e){
        const effect=document.createElement('div')
        effect.classList.add('clickeff')
        effect.style.width='20px'
        effect.style.height='20px'
        effect.style.backgroundColor='pink'
        effect.style.border='1px solid red'
        effect.style.left=`${e.clientX-10}px`
        effect.style.top=`${e.clientY-10}px`
        document.body.appendChild(effect);
        setTimeout(() => {
            effect.remove()
        }, 500);
    })
</script>
